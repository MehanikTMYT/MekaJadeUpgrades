/*
 * MekaJadeUpgrades - 26.1.2 port.
 *
 * Upstream: https://github.com/DevDyna/MekaJadeUpgrades (MIT, (c) DevDyna),
 * original version 1.3-21.1 for NeoForge 1.21.1 (ModDevGradle 1.x).
 *
 * This port migrates the build to ModDevGradle 2.x and targets
 * Minecraft 26.1.2 / NeoForge 26.1.2 / Java 25. It compiles against the
 * locally ported Mekanism 10.8.0 (mavenLocal) and Jade 26.1.12+neoforge.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

// Minecraft 26.1 ships Java 25 to end users, so the mod targets Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

neoForge {
    version = neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            gameDirectory = project.file('generated')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenLocal()
}

dependencies {
    // Locally ported Mekanism 10.8.0 for 26.1.2 (fleet "homebaked" build).
    compileOnly "mekanism:Mekanism:${mekanism_version}"
    // Jade 26.1.12+neoforge (client-side HUD API).
    compileOnly files("${rootDir}/libs/Jade-mc26.1-NeoForge-26.1.12.jar")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            meka_version_range     : meka_version_range,
            jade_version_range     : jade_version_range
            ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
